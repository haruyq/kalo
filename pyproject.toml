[project]
name = "kalo"
version = "0.1.0"
description = "tosu-compatible overlay server for KALPA: Cosmic Symphony (Stellar Point)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.146.0",
    "unitypy>=1.25.4",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
kalo = "kalo.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
